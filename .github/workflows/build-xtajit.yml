name: Build patched xtajit.dll

# Rebuilds only Madeira's 32-bit x86 module (FEX WoW64, shipped as xtajit.dll)
# with patches/fex-movs-addr16.patch and, if a base IPA URL is given, swaps it
# into that IPA. The patch is for personal testing; do not send it upstream
# (FEX-Emu does not accept AI-generated code).

on:
  workflow_dispatch:
    inputs:
      base_ipa_url:
        description: "Direct download URL of the Madeira IPA you have installed (empty = build the DLL only)"
        required: false
        default: ""
      fex_ref:
        description: "FEX commit to build; must be the commit your Madeira build was made from"
        required: false
        default: "f59cab95659e8add0c88f0c76ec1cf483c536dbf"
  push:
    branches: [ci/fex-wow64]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-ubuntu-22.04-x86_64.tar.xz
      FEX_REF: ${{ inputs.fex_ref || 'f59cab95659e8add0c88f0c76ec1cf483c536dbf' }}
      BASE_IPA_URL: ${{ inputs.base_ipa_url || '' }}
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Download the base IPA first (its link may expire)
        if: ${{ env.BASE_IPA_URL != '' }}
        run: |
          set -eu
          mkdir ipa
          cd ipa
          curl -fsSL --retry 3 -o base.bin "$BASE_IPA_URL"
          # An Actions artifact is a zip around the .ipa; an IPA is a zip around Payload/.
          if unzip -l base.bin | grep -q ' Payload/'; then
            mv base.bin base.ipa
          else
            unzip -q base.bin
            mv ./*.ipa base.ipa
          fi
          ls -l base.ipa

      - name: Fetch FEX at the requested commit
        run: |
          set -eu
          git init fex
          git -C fex remote add origin https://github.com/willfaust/FEX.git
          git -C fex fetch --depth 1 origin "$FEX_REF"
          git -C fex checkout --detach FETCH_HEAD
          git -C fex submodule update --init --depth 1 \
            External/vixl External/fmt External/xxhash External/zydis External/unordered_dense \
            External/range-v3 Source/Common/cpp-optparse External/rpmalloc
          git -C fex log -1 --format='FEX %H %s'

      - name: Apply the MOVS patch
        run: |
          set -eu
          git -C fex apply --check "$GITHUB_WORKSPACE/patches/fex-movs-addr16.patch"
          git -C fex apply "$GITHUB_WORKSPACE/patches/fex-movs-addr16.patch"
          git -C fex status --short

      - name: Install llvm-mingw
        run: |
          set -eu
          mkdir -p "$HOME/llvm-mingw"
          curl -fsSL --retry 3 "$LLVM_MINGW_URL" | tar -xJ -C "$HOME/llvm-mingw" --strip-components=1
          echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Configure and build the WoW64 module
        run: |
          set -eu
          # Same options as build/fex-wow64/build.sh in willfaust/madeira.
          cmake -S fex -B build-wow64 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/fex/Data/CMake/toolchain_mingw.cmake" \
            -DMINGW_TRIPLE=aarch64-w64-mingw32 \
            -DFEX_IOS_HOST_BUILD=ON -DCMAKE_C_FLAGS=-DFEX_IOS_HOST \
            -DCMAKE_CXX_FLAGS=-DFEX_IOS_HOST -DCMAKE_ASM_FLAGS=-DFEX_IOS_HOST \
            -DENABLE_LTO=OFF -DENABLE_ASSERTIONS=OFF -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF \
            -DBUILD_TESTING=OFF -DBUILD_FEXCONFIG=OFF -DTUNE_ARCH=generic -DTUNE_CPU=none \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build-wow64 --target wow64fex

      - name: Check the patch is in the DLL
        run: |
          set -eu
          mkdir out
          cp build-wow64/Bin/libwow64fex.dll out/xtajit.dll
          strings -a out/xtajit.dll | grep -q "REP with address size override not supported"
          if strings -a out/xtajit.dll | grep -q "MOVSOp: Can't handle address size override"; then
            echo "old MOVS message still present"; exit 1
          fi
          {
            echo "FEX commit: $(git -C fex rev-parse HEAD)"
            echo "sha256: $(sha256sum out/xtajit.dll | cut -d' ' -f1)"
          } | tee out/BUILD_INFO.txt

      - name: Swap the DLL into the base IPA
        if: ${{ env.BASE_IPA_URL != '' }}
        run: |
          set -eu
          cd ipa
          unzip -q base.ipa
          DLL=$(find Payload -type f -name xtajit.dll -path '*aarch64-windows*' | head -n1)
          test -n "$DLL" || { echo "no aarch64-windows/xtajit.dll in this IPA"; exit 1; }
          echo "replacing $DLL"
          ls -l "$DLL"
          cp ../out/xtajit.dll "$DLL"
          rm -rf Payload/*.app/_CodeSignature
          zip -qry ../out/Madeira-xtajit-patched.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: madeira-xtajit
          path: out/
          if-no-files-found: error
